name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # .nvmrc holds the declared FLOOR (engines.node "^22.13.0 || >=24"),
          # not "latest 22": CI must run the oldest Node we claim to support,
          # or --engine-strict below can't notice a dependency that raises it.
          node-version-file: .nvmrc
          cache: npm

      # --engine-strict turns npm's EBADENGINE warning into a failure. Without
      # it, pdfjs-dist requiring Node >=22.13 scrolled past as a warning in a
      # green build for months while CI ran Node 20 (#353).
      - run: npm ci --engine-strict
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # On pushes to main, also produce the Web Store zip and keep it as a
      # downloadable artifact for the release.
      - name: Package Web Store zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run package

      - name: Upload Web Store zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-store-package
          path: web-store-package.zip
          if-no-files-found: error

  server:
    name: Server install · syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # npm ci can run lifecycle scripts; keep the read-only Actions token
          # out of Git config before third-party code executes.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Deliberately the floor server/package.json declares (engines.node
          # ">=22.13.0"), read from the same .nvmrc as the extension job.
          # Running a newer Node here than engines.node declares would
          # silently disarm the --engine-strict check below.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The proxy has no build step, but it does have dependencies, and
      # dependabot watches /server weekly. Installing them is what makes this
      # job able to fail on a bump that the declared Node cannot run:
      # --engine-strict turns npm's EBADENGINE warning into a non-zero exit.
      - run: npm ci --engine-strict
        working-directory: server

      - run: node --check index.js
        working-directory: server
      - run: node --check classify.js
        working-directory: server
