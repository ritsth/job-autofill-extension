name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # On pushes to main, also produce the Web Store zip and keep it as a
      # downloadable artifact for the release.
      - name: Package Web Store zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run package

      - name: Upload Web Store zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-store-package
          path: web-store-package.zip
          if-no-files-found: error

  server:
    name: Server install · syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          # Deliberately the same version server/package.json declares
          # (engines.node ">=20") and .nvmrc pins. Raising it here without
          # raising engines.node would silently disarm the --engine-strict
          # check below.
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The proxy has no build step, but it does have dependencies, and
      # dependabot watches /server weekly. Installing them is what makes this
      # job able to fail on a bump that the declared Node cannot run:
      # --engine-strict turns npm's EBADENGINE warning into a non-zero exit.
      - run: npm ci --engine-strict
        working-directory: server

      - run: node --check index.js
        working-directory: server
      - run: node --check classify.js
        working-directory: server
