version: 2
updates:
  # Extension dependencies (root package.json).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Cloud Run proxy dependencies.
  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Keep GitHub Actions pinned actions up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      # init and analyze must run the same version or the CodeQL job fails, so
      # they have to arrive in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
